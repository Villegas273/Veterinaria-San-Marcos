<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary vh-100">
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav flex-column text-center w-100">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                     <a class="nav-link active" aria-current="page" href="productos.html"><i class="bi bi-box-seam"></i>  Productos</a>
                </li>
            </ul>
        </div>
        </div>
    </nav>

    <main class="p-4 flex-grow-1">
        <h1>Usuarios</h1>
        <article>
                <button type="button" class="btn btn-info" data-bs-toggle="modal" data-bs-target="#ModalAgregar">
                    Agregar Usuario
                </button>
                <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#ModalEditar">
                    Editar Usuario
                </button>
                <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#ModalEliminar">
                    Eliminar Usuario
                </button>


            <div class="modal fade" id="ModalAgregar" tabindex="-1" aria-labelledby="modalAgregarLabel"
                aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="modalAgregarLabel">
                                Agregar Usuario
                            </h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="UserAgregar">
                                <label for="productoAgregar">User</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="EmailAgregar">
                                <label for="descripcionAgregar">Correo</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="PasswAgregar">
                                <label for="precioAgregar">Password</label>
                            </div>

                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                Cerrar
                            </button>
                            <button type="button" class="btn btn-success">
                                Agregar
                            </button>
                        </div>

                    </div>
                </div>
            </div>


            <div class="modal fade" id="ModalEditar" tabindex="-1" aria-labelledby="modalEditarLabel"
                aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="modalEditarLabel">
                                Editar Usuario
                            </h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">


                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                Cerrar
                            </button>
                            <button type="button" class="btn btn-warning">
                                Guardar cambios
                            </button>
                        </div>

                    </div>
                </div>
            </div>

            <div class="modal fade" id="ModalEliminar" tabindex="-1" aria-labelledby="modalEliminarLabel"
                aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="modalEliminarLabel">
                                Eliminar Usuario
                            </h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">
                            <br>
                             Ingresa el ID del Usuario
                            <br>
                            <input type="number" class="form-control">
                            <br>
                        
                            ¿Está seguro de que desea eliminar este Usuario?
                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                Cancelar
                            </button>
                            <button type="button" class="btn btn-danger">
                                Eliminar
                            </button>
                        </div>

                    </div>
                </div>
            </div>

        </article>
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">User</th>
                    <th scope="col">Email</th>
                    <th scope="col">Password</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">1</th>
                    <td>Admin</td>
                    <td>admin@veterinaria.cl</td>
                    <td>***************</td>
                </tr>
            </tbody>
        </table>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

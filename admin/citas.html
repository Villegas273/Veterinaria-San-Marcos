    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary vh-100">
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav flex-column text-center w-100">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="usuarios.html"><i class="bi bi-person-bounding-box"></i>  Usuarios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="productos.html"><i class="bi bi-box-seam"></i>  Productos</a>
                </li>
            </ul>
        </div>
        </div>
    </nav>

    <main class="p-4 flex-grow-1">
        <h1>Citas</h1>
        <article>
                <button type="button" class="btn btn-info" data-bs-toggle="modal" data-bs-target="#ModalAgregar">
                    Agregar Cita
                </button>
                <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#ModalEditar">
                    Editar Cita
                </button>
                <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#ModalEliminar">
                    Eliminar Cita
                </button>


            <div class="modal fade" id="ModalAgregar" tabindex="-1" aria-labelledby="modalAgregarLabel"
                aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="modalAgregarLabel">
                                Agregar Cita
                            </h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="citaAgregar">
                                <label for="productoAgregar">Tipo Mascota</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="citaAgregar">
                                <label for="descripcionAgregar">Descripcion</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="date" class="form-control" id="citaAgregar">
                                <label for="citaAgregar">Fecha</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="number" class="form-control" id="citaAgregar">
                                <label for="precioAgregar">Precio $</label>
                            </div>
                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                Cerrar
                            </button>
                            <button type="button" class="btn btn-success">
                                Agregar
                            </button>
                        </div>

                    </div>
                </div>
            </div>


            <div class="modal fade" id="ModalEditar" tabindex="-1" aria-labelledby="modalEditarLabel"
                aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="modalEditarLabel">
                                Editar Cita
                            </h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">
                             <div class="modal-body">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="citaAgregar">
                                <label for="citaAgregar">ID</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="citaAgregar">
                                <label for="citaAgregar">Tipo Mascota</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="citaAgregar">
                                <label for="citaAgregar">Descripcion</label>
                            </div>
                             <div class="form-floating mb-3">
                                <input type="date" class="form-control" id="citaAgregar">
                                <label for="citaAgregar">Fecha</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="number" class="form-control" id="citaAgregar">
                                <label for="citaAgregar">Precio $</label>
                            </div>
                        </div>

                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                Cerrar
                            </button>
                            <button type="button" class="btn btn-warning">
                                Guardar cambios
                            </button>
                        </div>

                    </div>
                </div>
            </div>

            <div class="modal fade" id="ModalEliminar" tabindex="-1" aria-labelledby="modalEliminarLabel"
                aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="modalEliminarLabel">
                                Eliminar Cita
                            </h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">
                            ¿Está seguro de que desea eliminar esta cita?
                             <div class="form-floating mb-3">
                                <input type="number" class="form-control" id="citaEliminar">
                                <label for="citaEliminar">ID</label>
                            </div>
                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                Cancelar
                            </button>
                            <button type="button" class="btn btn-danger">
                                Eliminar
                            </button>
                        </div>

                    </div>
                </div>
            </div>

        </article>
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Tipo Mascota</th>
                    <th scope="col">Descripcion</th>
                    <th scope="col">Fecha</th>
                    <th scope="col">Precio</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th scope="row">1</th>
                    <td>Perro</td>
                    <td>Chequeo</td>
                    <td>10/09/2026</td>
                    <td>9900</td>
                </tr>
                  <tr>
                    <th scope="row">2</th>
                    <td>Gato</td>
                    <td>Chequeo</td>
                    <td>12/09/2026</td>
                    <td>6990</td>

                </tr>
            </tbody>
        </table>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

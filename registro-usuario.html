
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <h1 class="text-primary">Registro de usuario</h1>
        <form id="form-registro">

    <div class="mb-3">
        <label for="run" class="form-label">RUN</label>
        <input type="text" id="run" class="form-control">
    </div>

    <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" id="nombre" class="form-control">
    </div>

    <div class="mb-3">
        <label for="apellidos" class="form-label">Apellidos</label>
        <input type="text" id="apellidos" class="form-control">
    </div>
    <div class="mb-3">
    <label for="correo" class="form-label">Correo electrónico</label>
    <input type="email" id="correo" class="form-control">
    </div>

    <div class="mb-3">
    <label for="fecha-nacimiento" class="form-label">Fecha de nacimiento</label>
    <input type="date" id="fecha-nacimiento" class="form-control">
    </div>

    <div class="mb-3">
    <label for="direccion" class="form-label">Dirección</label>
    <input type="text" id="direccion" class="form-control">
    </div>

    <div class="mb-3">
    <label for="region" class="form-label">Región</label>
    <select id="region" class="form-select">
        <option value="">Seleccione una región</option>
    </select>
    </div>

    <div class="mb-3">
    <label for="comuna" class="form-label">Comuna</label>
    <select id="comuna" class="form-select">
        <option value="">Seleccione una comuna</option>
    </select>
    </div>

    <button type="submit" class="btn btn-primary">
      Registrar
    </button> 

</form>

    </div>
    <script src="js/registro-usuario.js"></script>

</body>
</html>
